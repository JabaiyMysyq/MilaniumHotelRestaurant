<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ресторан | Restaurant | Мейрамхана</title>
  
  <!-- Подключение премиальных шрифтов Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #1a1a1a;
      --accent-gold: #c5a059;
      --accent-gold-hover: #b08d48;
      --bg-color: #f8f6f2;
      --card-bg: #ffffff;
      --text-muted: #666666;
      --whatsapp-color: #25D366;
      --whatsapp-hover: #1ebe57;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-color);
    }

    /* Шапка отельного ресторана */
    .hotel-header {
      text-align: center;
      max-width: 600px;
      margin-bottom: 10px;
    }

    .hotel-header .sub-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--accent-gold);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .hotel-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
      color: var(--primary-color);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .multilingual-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: var(--accent-gold);
      font-style: italic;
      letter-spacing: 1px;
    }

    .multilingual-title span.dot {
      font-size: 10px;
      vertical-align: middle;
      opacity: 0.7;
    }

    /* Декоративная линия */
    .divider {
      width: 60px;
      height: 2px;
      background-color: var(--accent-gold);
      margin: 20px auto 0 auto;
    }

    /* Карточки страниц меню */
    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 700px;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    img:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
    }

    /* Блок контактов */
    .contact-card {
      background-color: var(--card-bg);
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(197, 160, 89, 0.2);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    .contact-card .card-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .contact-card .phone-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* Стили для кнопки WhatsApp */
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--whatsapp-color);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: all 0.3s ease;
    }

    .whatsapp-btn:hover {
      background-color: var(--whatsapp-hover);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      transform: translateY(-2px);
    }

    /* Адаптивность для смартфонов */
    @media (max-width: 480px) {
      body {
        padding: 25px 15px;
        gap: 25px;
      }

      .hotel-header h1 {
        font-size: 32px;
      }

      .multilingual-title {
        font-size: 16px;
        gap: 8px;
      }

      .contact-card {
        padding: 25px 20px;
      }

      .contact-card .phone-number {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Заголовок ресторана на 3 языках -->
  <header class="hotel-header">
    <div class="sub-subtitle">HOTEL RESTAURANT</div>
    <h1>РЕСТОРАН</h1>
    <div class="multilingual-title">
      <span>Ресторан</span>
      <span class="dot">•</span>
      <span>Restaurant</span>
      <span class="dot">•</span>
      <span>Мейрамхана</span>
    </div>
    <div class="divider"></div>
  </header>

  <!-- Блок с контактами и ссылкой на WhatsApp -->
  <div class="contact-card">
    <div class="card-label">Бронирование и информация</div>
    <div class="phone-number">+7 (705) 777-08-16</div>
    <a href="https://wa.me/77057770816" class="whatsapp-btn" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.572-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
      </svg>
      <span>Написать в WhatsApp</span>
    </a>
  </div>

  <!-- Файлы страниц меню -->
  <main class="menu-container">
    <img src="pic1.jpeg" alt="Страница 1">
    <img src="pic2.jpeg" alt="Страница 2">
    <img src="pic3.jpeg" alt="Страница 3">
    <img src="pic4.jpeg" alt="Страница 4">
  </main>

</body>
</html>
